version: '3.8'

services:
  # --- SERVICE 1: DATABASE (Si Drummer) ---
  db:
    image: postgres:15-alpine
    container_name: inventory_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mydonutgua123
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- SERVICE 2: MEJA RESEPSIONIS (Redis) ---
  redis_server:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6380:6379"
    restart: always

  # --- SERVICE 3: APLIKASI KASIR (Si Kasir - Pintu Publik Ditutup) ---
  app:
    build: .
    container_name: inventory_app_container
    restart: always
    # Pintu 8000 kita matikan agar dunia luar tidak bisa langsung masuk
    # ports:
    #   - "8000:8000"
    depends_on:
      - db             
      - redis_server   
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=mydonutgua123
      - DB_NAME=inventory_db
      - REDIS_URL=redis://redis_container:6379

  # --- SERVICE 4: KOKI (Celery Worker) ---
  celery_worker:
    build: .
    container_name: celery_worker_container
    command: celery -A worker worker --loglevel=info
    depends_on:
      - db
      - redis_server
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=mydonutgua123
      - DB_NAME=inventory_db
      - REDIS_URL=redis://redis_container:6379

  # --- SERVICE 5: MANAJER (Celery Beat) ---
  celery_beat:
    build: .
    container_name: celery_beat_container
    command: celery -A worker beat --loglevel=info
    depends_on:
      - db
      - redis_server
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=mydonutgua123
      - DB_NAME=inventory_db
      - REDIS_URL=redis://redis_container:6379

  # --- SERVICE 6: SATPAM GERBANG DEPAN (Nginx Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80" # Membuka gerbang utama ke dunia luar
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

# --- DEFINISI VOLUME (GUDANG DATA) ---
volumes:
  postgres_data: