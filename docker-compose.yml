services:
  # --- SERVICE 1: DATABASE (Si Drummer) ---
  db:
    image: postgres:15-alpine
    container_name: inventory_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- SERVICE 2:  (Redis) ---
  redis_server:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6380:6379"
    restart: always

  # --- SERVICE 3: APLIKASI KASIR ---
  app:
    build: .
    image: latiff74/warehouse-api:latest 
    container_name: inventory_app_container
    restart: always
    depends_on:
      - db
      - redis_server
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=${REDIS_URL}

  # --- SERVICE 4:  Celery Worker ---
  celery_worker:
    image: latiff74/warehouse-api:latest
    container_name: celery_worker_container
    command: celery -A worker worker --loglevel=info
    depends_on:
      - db
      - redis_server
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=${REDIS_URL}

  # --- SERVICE 5:  Celery Beat ---
  celery_beat:
    image: latiff74/warehouse-api:latest
    container_name: celery_beat_container
    command: celery -A worker beat --loglevel=info
    depends_on:
      - db
      - redis_server
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - REDIS_URL=${REDIS_URL}

  # --- SERVICE 6: Nginx ---
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro 
    depends_on:
      - app

  # --- SERVICE 7: Watchtower ---
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower_bot
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER=1.44
    command: --interval 300 --cleanup

# --- DEFINISI VOLUME ---
volumes:
  postgres_data: