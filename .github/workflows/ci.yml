name: Docker Build & Push Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Login ke Docker Hub using password
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Menyiapkan mesin Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. Merakit container dan MENGIRIMNYA ke Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # use your username
          tags: latiff74/warehouse-api:latest