server {
    # Nginx berjaga di Gerbang Utama (Port 80)
    listen 80;
    server_name portofolio-inventaris-latif.duckdns.org;
    return 301 https://$host$request_uri;
}
server{
    listen 443 ssl;
    server_name portofolio-inventaris-latif.duckdns.org;

    #alamat sertif yang diambil
    ssl_certificate /etc/letsencrypt/live/portofolio-inventaris-latif.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portofolio-inventaris-latif.duckdns.org/privkey.pem;

    # Optimasi keamanan SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    location / {
        # Meneruskan tamu ke layanan 'app' (FastAPI) di port 8000
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}